<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon's Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --accent: #2563eb;
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-top: 10px;
        }
        .logo-area h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }
        .logo-area p {
            font-size: 13px;
            color: var(--text-sub);
        }
        .profile-badge {
            background: #e0e7ff;
            color: #3730a3;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }
        .search-box {
            position: relative;
            margin-bottom: 16px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus {
            border-color: var(--accent);
        }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
        }
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar {
            display: none;
        }
        .cat-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-sub);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cat-btn.active {
            background: var(--text-main);
            color: #ffffff;
            border-color: var(--text-main);
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
        }
        .story-count {
            font-size: 12px;
            color: var(--text-sub);
            background: var(--border-color);
            padding: 2px 8px;
            border-radius: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:active {
            transform: scale(0.98);
        }
        .card-img {
            width: 100%;
            aspect-ratio: 2 / 3;
            background: #e2e8f0;
            object-fit: cover;
        }
        .card-body {
            padding: 10px;
        }
        .card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-cat {
            font-size: 11px;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 600;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }
        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            border-radius: 20px 20px 0 0;
            padding: 24px;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 1, 0.1, 1);
        }
        .modal.open .modal-content {
            transform: translateY(0);
        }
        .close-btn {
            float: right;
            background: var(--border-color);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-area">
                <h1>Moon's Library</h1>
                <p>Personal Digital Shelf</p>
            </div>
            <div class="profile-badge">ML</div>
        </header>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search stories...">
        </div>

        <div class="categories" id="categoryList">
            <button class="cat-btn active" data-cat="All">All Stories</button>
            <button class="cat-btn" data-cat="Fiction">Fiction</button>
            <button class="cat-btn" data-cat="Romance">Romance</button>
            <button class="cat-btn" data-cat="Mystery">Mystery</button>
            <button class="cat-btn" data-cat="Poetry">Poetry</button>
        </div>

        <div class="section-header">
            <h2 class="section-title">Bookshelf</h2>
            <span class="story-count" id="storyCount">0 Stories</span>
        </div>

        <div class="grid" id="storyGrid"></div>
    </div>

    <div class="modal" id="storyModal">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">×</button>
            <h2 id="modalTitle" style="margin-bottom: 8px;"></h2>
            <p id="modalCat" style="font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 16px;"></p>
            <div id="modalText" style="font-size: 14px; line-height: 1.6; color: #334155;"></div>
        </div>
    </div>

    <script>
        const storiesData = [
            {
                id: 1,
                title: "The Moonlight Secret",
                category: "Mystery",
                cover: "https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&w=400&q=80",
                content: "Eti ekta rohoshyo golpo. Proti ratre cader aloy ekjon odrishyo manushke dekha jeto..."
            },
            {
                id: 2,
                title: "Aamar Shopno",
                category: "Fiction",
                cover: "https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=400&q=80",
                content: "Jiboner choto choto asha r bhalobasha niye ei golpo ti toiri..."
            }
        ];

        const storyGrid = document.getElementById('storyGrid');
        const storyCount = document.getElementById('storyCount');
        const searchInput = document.getElementById('searchInput');
        const categoryList = document.getElementById('categoryList');
        const storyModal = document.getElementById('storyModal');
        const closeModal = document.getElementById('closeModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalCat = document.getElementById('modalCat');
        const modalText = document.getElementById('modalText');

        let currentCategory = 'All';

        function renderStories(filter = '', category = 'All') {
            storyGrid.innerHTML = '';
            const filtered = storiesData.filter(story => {
                const matchesSearch = story.title.toLowerCase().includes(filter.toLowerCase());
                const matchesCat = category === 'All' || story.category === category;
                return matchesSearch && matchesCat;
            });

            storyCount.textContent = `${filtered.length} Stories`;

            if (filtered.length === 0) {
                storyGrid.innerHTML = `<p style="grid-column: span 2; text-align: center; color: var(--text-sub); padding: 20px;">No stories found.</p>`;
                return;
            }

            filtered.forEach(story => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${story.cover}" class="card-img" alt="${story.title}">
                    <div class="card-body">
                        <div class="card-title">${story.title}</div>
                        <div class="card-cat">${story.category}</div>
                    </div>
                `;
                card.addEventListener('click', () => openModal(story));
                storyGrid.appendChild(card);
            });
        }

        function openModal(story) {
            modalTitle.textContent = story.title;
            modalCat.textContent = story.category;
            modalText.textContent = story.content;
            storyModal.classList.add('open');
        }

        closeModal.addEventListener('click', () => {
            storyModal.classList.remove('open');
        });

        storyModal.addEventListener('click', (e) => {
            if (e.target === storyModal) {
                storyModal.classList.remove('open');
            }
        });

        searchInput.addEventListener('input', (e) => {
            renderStories(e.target.value, currentCategory);
        });

        categoryList.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') {
                document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.getAttribute('data-cat');
                renderStories(searchInput.value, currentCategory);
            }
        });

        renderStories();
    </script>
</body>
</html>
